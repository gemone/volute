name: Cross-Platform Encoding Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  encoding-test:
    name: ${{ matrix.os }} Encoding Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            zig-version: "0.16.0"
          - os: macos-latest
            zig-version: "0.16.0"
          - os: windows-latest
            zig-version: "0.16.0"

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Zig ${{ matrix.zig-version }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libunistring-dev zlib1g-dev libncurses-dev

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ncurses libunistring zlib
          echo "LIBRARY_PATH=/opt/homebrew/lib:/usr/local/lib:${LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "CPATH=/opt/homebrew/include:/usr/local/include:${CPATH}" >> "$GITHUB_ENV"

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-libunistring mingw-w64-x86_64-ncurses mingw-w64-x86_64-zlib
          echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> $env:GITHUB_ENV

      - name: Cache Zig dependencies
        uses: actions/cache@v5
        with:
          path: |
            .zig-cache
            zig-cache
            zig-out
          key: ${{ runner.os }}-${{ runner.arch }}-zig-v${{ matrix.zig-version }}-encoding-test
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-v${{ matrix.zig-version }}-

      - name: Build project
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            zig build -Doptimize=ReleaseFast -Dtarget=x86_64-windows-gnu -Dmsys2-include=C:/msys64/mingw64/include
          else
            zig build -Doptimize=ReleaseFast
          fi

      - name: Run unit tests
        if: runner.os == 'Linux'
        run: zig build test

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run encoding correctness tests
        run: python -m pytest tests/test_encoding.py -v

      - name: Test CLI transcoding functionality
        shell: bash
        run: |
          echo "Testing CLI transcoding..."
          VX_BIN=./zig-out/bin/vx
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            VX_BIN=./zig-out/bin/vx.exe
          fi
          TMP_DIR="$(mktemp -d)"

          # Test ASCII round-trip
          echo "Hello World" > "$TMP_DIR/test_ascii.txt"
          "$VX_BIN" -e ascii -o "$TMP_DIR/test_output_ascii.txt" "$TMP_DIR/test_ascii.txt"

          # Test UTF-8 round-trip
          echo "测试中文" > "$TMP_DIR/test_utf8.txt"
          "$VX_BIN" -e utf-8 -o "$TMP_DIR/test_output_utf8.txt" "$TMP_DIR/test_utf8.txt"

          echo "✅ CLI transcoding tests passed on ${{ matrix.os }}"

      - name: Platform-specific encoding validation
        shell: bash
        run: |
          echo "Platform: ${{ matrix.os }}"
          echo "Architecture: ${{ runner.arch }}"
          TMP_DIR="$(mktemp -d)"
          echo "测试中文" > "$TMP_DIR/test_utf8.txt"

          # Test platform-specific encodings
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "Testing Linux-specific encodings..."
            ./zig-out/bin/vx -e utf-8 -o "$TMP_DIR/test_linux.txt" "$TMP_DIR/test_utf8.txt"
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "Testing macOS-specific encodings..."
            ./zig-out/bin/vx -e utf-8 -o "$TMP_DIR/test_macos.txt" "$TMP_DIR/test_utf8.txt"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "Testing Windows-specific encodings..."
            ./zig-out/bin/vx.exe -e utf-8 -o "$TMP_DIR/test_windows.txt" "$TMP_DIR/test_utf8.txt"
          fi

          echo "✅ Platform-specific encoding tests passed"
