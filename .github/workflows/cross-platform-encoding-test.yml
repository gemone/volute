name: Cross-Platform Encoding Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  encoding-test:
    name: ${{ matrix.os }} Encoding Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            zig-version: "0.16.0"
          - os: macos-latest
            zig-version: "0.16.0"
          - os: windows-latest
            zig-version: "0.16.0"

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Zig ${{ matrix.zig-version }}
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Cache Zig dependencies
        uses: actions/cache@v5
        with:
          path: |
            .zig-cache
            zig-cache
            zig-out
          key: ${{ runner.os }}-${{ runner.arch }}-zig-v${{ matrix.zig-version }}-encoding-test
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-v${{ matrix.zig-version }}-

      - name: Build project
        run: zig build -Doptimize=ReleaseFast

      - name: Run unit tests
        run: zig build test

      - name: Run encoding correctness tests
        shell: bash
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run pytest tests/test_encoding.py -v
          else
            python3 -m venv .venv
            source .venv/bin/activate
            python -m pip install --upgrade pip
            python -m pip install pytest
            python -m pytest tests/test_encoding.py -v
          fi

      - name: Test CLI transcoding functionality
        shell: bash
        run: |
          echo "Testing CLI transcoding..."
          
          # Test ASCII round-trip
          echo "Hello World" > /tmp/test_ascii.txt
          ./zig-out/bin/vx -e ascii -o /tmp/test_output_ascii.txt /tmp/test_ascii.txt
          
          # Test UTF-8 round-trip
          echo "测试中文" > /tmp/test_utf8.txt
          ./zig-out/bin/vx -e utf-8 -o /tmp/test_output_utf8.txt /tmp/test_utf8.txt
          
          echo "✅ CLI transcoding tests passed on ${{ matrix.os }}"

      - name: Platform-specific encoding validation
        shell: bash
        run: |
          echo "Platform: ${{ matrix.os }}"
          echo "Architecture: ${{ runner.arch }}"
          
          # Test OS-specific target paths while exercising the same transcode flow.
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            out=/tmp/test_linux.txt
          else
            out=/tmp/test_macos.txt
          fi
          ./zig-out/bin/vx -e utf-8 -o "$out" /tmp/test_utf8.txt
          
          echo "✅ Platform-specific encoding tests passed"
