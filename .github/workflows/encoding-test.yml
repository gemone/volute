name: Encoding Tests

on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - 'src/codecs/**'
      - 'src/vx/line_ending.zig'
      - 'tests/test_encoding*.py'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/encoding-test.yml'
  workflow_dispatch:

jobs:
  encoding-test:
    name: ${{ matrix.os }} Encoding Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Cache Zig dependencies
        uses: actions/cache@v5
        with:
          path: |
            .zig-cache
            zig-cache
            zig-out
          key: ${{ runner.os }}-${{ runner.arch }}-zig-v0.16.0-encoding-test
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-v0.16.0-

      - name: Build vx
        run: zig build -Doptimize=ReleaseFast

      - name: Run unit tests
        run: zig build test

      - name: Install pytest
        run: pip install pytest

      - name: Run encoding correctness tests
        run: python3 -m pytest tests/test_encoding.py -v

      - name: Test CLI transcoding
        run: |
          ./zig-out/bin/vx --version
          echo "Hello World" > /tmp/test.txt
          ./zig-out/bin/vx -e utf-8 -o /tmp/out.txt /tmp/test.txt
          echo "✅ Encoding tests passed on ${{ matrix.os }}"
