name: Encoding Tests

on:
  pull_request:
  push:
    branches:
      - master
      - refactor/zzz
    paths:
      - 'src/codecs/**'
      - 'src/vx/line_ending.zig'
      - 'tests/test_encoding*.py'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/encoding-test.yml'
  workflow_dispatch:

jobs:
  encoding-test:
    name: ${{ matrix.os }} Encoding Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Zig 0.16.0
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.16.0"

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libunistring-dev zlib1g-dev libncurses-dev

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ncurses libunistring zlib
          echo "LIBRARY_PATH=/opt/homebrew/lib:/usr/local/lib:${LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "CPATH=/opt/homebrew/include:/usr/local/include:${CPATH}" >> "$GITHUB_ENV"

      - name: Cache Zig dependencies
        uses: actions/cache@v5
        with:
          path: |
            .zig-cache
            zig-cache
            zig-out
          key: ${{ runner.os }}-${{ runner.arch }}-zig-v0.16.0-encoding-test
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-v0.16.0-

      - name: Build vx
        run: zig build -Doptimize=ReleaseFast

      - name: Run unit tests
        if: runner.os == 'Linux'
        run: zig build test

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run encoding correctness tests
        run: python -m pytest tests/test_encoding.py -v

      - name: Test CLI transcoding
        shell: bash
        run: |
          VX_BIN=./zig-out/bin/vx
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            VX_BIN=./zig-out/bin/vx.exe
          fi
          TMP_DIR="$(mktemp -d)"
          "$VX_BIN" --version
          echo "Hello World" > "$TMP_DIR/test.txt"
          "$VX_BIN" -e utf-8 -o "$TMP_DIR/out.txt" "$TMP_DIR/test.txt"
          echo "✅ Encoding tests passed on ${{ matrix.os }}"
