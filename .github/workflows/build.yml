name: Build
on:
  pull_request:
  push:
    branches:
      - master
      - refactor/zzz
  merge_group:
  schedule:
    - cron: "00 01 * * *"

env:
  ZIG_VERSION: "0.16.0"
  # This key can be changed to bust the cache of codec tables.
  CODEC_CACHE_VERSION: ""

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libunistring-dev zlib1g-dev libncurses-dev

      - name: Cache Zig dependencies
        uses: actions/cache@v5
        with:
          path: |
            .zig-cache
            zig-cache
            zig-out
          key: ${{ runner.os }}-${{ runner.arch }}-zig-v${{ env.ZIG_VERSION }}-${{ env.CODEC_CACHE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-v${{ env.ZIG_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Build project
        run: zig build

      - name: Run unit tests
        if: runner.os == 'Linux'
        run: zig build test

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libunistring-dev zlib1g-dev libncurses-dev

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install ncurses libunistring zlib
          echo "LIBRARY_PATH=/opt/homebrew/lib:/usr/local/lib:${LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "CPATH=/opt/homebrew/include:/usr/local/include:${CPATH}" >> "$GITHUB_ENV"

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-libunistring mingw-w64-x86_64-ncurses mingw-w64-x86_64-zlib
          echo "LIBRARY_PATH=C:/msys64/mingw64/lib" >> $env:GITHUB_ENV

      - name: Cache Zig dependencies
        uses: actions/cache@v5
        with:
          path: |
            .zig-cache
            zig-cache
            zig-out
          key: ${{ runner.os }}-${{ runner.arch }}-zig-v${{ env.ZIG_VERSION }}-${{ env.CODEC_CACHE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-v${{ env.ZIG_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Build project
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            zig build -Dtarget=x86_64-windows-gnu -Dmsys2-include=C:/msys64/mingw64/include
          else
            zig build
          fi

      - name: Run unit tests
        if: runner.os == 'Linux'
        run: zig build test

      - name: Run encoding validation tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if command -v uv &> /dev/null; then
            uv run pytest tests/test_encoding.py -v
          else
            echo "uv not found, skipping Python tests"
          fi

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libunistring-dev zlib1g-dev libncurses-dev

      - name: Cache Zig dependencies
        uses: actions/cache@v5
        with:
          path: |
            .zig-cache
            zig-cache
            zig-out
          key: ${{ runner.os }}-${{ runner.arch }}-zig-v${{ env.ZIG_VERSION }}-${{ env.CODEC_CACHE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-zig-v${{ env.ZIG_VERSION }}-
            ${{ runner.os }}-${{ runner.arch }}-zig-

      - name: Check build
        run: zig build

      - name: Run tests
        run: zig build test
